apiVersion: v1

kind: PersistentVolume

metadata:
    
    name: shared-pv

spec:

    capacity:

        storage: 10Gi

    accessModes:

        - ReadWriteMany
    
    persistentVolumeReclainPolicy: Retain
    
    local:
        
        path: /mnt/data

        storageClassName: local-storage

    hostPath:
        
        type: Directory

        path: /mnt/data

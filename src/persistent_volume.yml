apiVersion: v1

kind: PersistentVolume

metadata:
    
    name: shared-pv

spec:

    capacity:

        storage: 10Gi

    accessModes:

        - ReadWriteMany
    
    persistentVolumeReclaimPolicy: Retain

    storageClassName: dynamic-storage

    local:
        
        path: /mnt/data

    nodeAffinity:
    
        required:
            
            nodeSelectorTerms:
           
            - matchExpressions:
           
                - key: kubernetes.io/hostname
                  
                  operator: In
                  
                  values:
                  
                  - minikube

apiVersion: apps/v1

kind: Deployment

metadata:
  name: model-inference

spec:

  replicas: 1

  selector:

    matchLabels:

      app: model-inference

  template:

    metadata:

      labels:

        app: model-inference

    spec:

      containers:

      - name: model-inference-container
      
        image: anatasia/modelinference:latest
      
        volumeMounts:
      
        - name: shared-pv
      
          mountPath: /mnt/data
      
      volumes:
      
      - name: shared-pv

        persistentVolumeClaim:

          claimName: shared-pvc
            

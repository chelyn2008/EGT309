apiVersion: apps/v1

kind: Deployment

metadata:
  name: model-training

spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-training
  template:
    metadata:
      labels:
        app: model-training
    spec:
      containers:
      - name: model-training-container
        image: chelyn/modeltraining:latest
        volumeMounts:
        - name: shared-storage
          mountPath: /mnt/pv
      volumes:
      - name: shared-storage
        hostPath:
            path: /mnt/data
            type: Directory

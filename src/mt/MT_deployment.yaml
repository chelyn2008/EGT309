apiVersion: apps/v1

kind: Deployment

metadata:

  name: model-training

spec:

  replicas: 10

  selector:

    matchLabels:

      chapter: services

  template:

    metadata:

      labels:

        chapter: services

    spec:

      containers:

      - name: model-training-container

        image: chelyn/modeltraining:latest

        ports:

        - containerPort: 8080

        volumeMounts:

          - name: shared-volume

            mountPath: /data

      volumes:

      - name: shared-volume

        emptyDir: {}